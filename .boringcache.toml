workspace = "boringcache/benchmark-opentelemetry-java"

[adapters.gradle]
tag = "otel-gradle-local"
no-platform = true
no-git = true
metadata-hints = ["benchmark=opentelemetry-java", "upstream-job=build-test-java-21"]
command = [
  "bash", "-euo", "pipefail", "-c",
  "exec ./gradlew build -PtestJavaVersion=21 \"-Porg.gradle.java.installations.paths=${TEST_JAVA_HOME:?}\" \"-Porg.gradle.java.installations.auto-download=false\"",
]
