name: "OpenTelemetry Java Gradle - GHA"
run-name: >-
  ${{ format('{0} | {1}', github.event_name == 'workflow_dispatch' && inputs.cache_lane == 'rolling' && 'GHA Rolling' || 'GHA Fresh', github.event_name == 'schedule' && 'Weekly fresh' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}

on:
  workflow_dispatch:
    inputs:
      cache_lane:
        description: "Benchmark lane"
        required: false
        type: choice
        default: fresh
        options:
          - fresh
          - rolling
      gradle_local_build_cache_policy:
        description: "Diagnostic local Gradle build-cache policy"
        required: false
        type: choice
        default: default
        options:
          - default
          - strip
permissions:
  contents: read
  actions: write

jobs:
  benchmark:
    name: GHA
    uses: ./.github/workflows/reusable-gradle-benchmark.yml
    with:
      benchmark_id: otel-gradle
      project_repo: open-telemetry/opentelemetry-java
      strategy: actions-cache
      cache_lane: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_lane || 'fresh' }}
      gradle_local_build_cache_policy: ${{ github.event_name == 'workflow_dispatch' && inputs.gradle_local_build_cache_policy || 'default' }}
      java_version: "21"
      # Pin japicmp baseline so the pinned source stays benchmarkable after newer releases land.
      build_command: ./gradlew --no-daemon build -x test -Porg.gradle.java.installations.auto-download=false -PapiBaseVersion=1.59.0
    secrets: inherit
