name: "OpenTelemetry Java Gradle Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || 'Rolling', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/workflows/opentelemetry-java-gradle-benchmark.yml"
      - ".github/workflows/opentelemetry-java-gradle-fresh-benchmark.yml"
      - ".github/workflows/reusable-gradle-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"

permissions:
  contents: read
  actions: write

jobs:
  github-actions-cache:
    name: GHA
    uses: ./.github/workflows/reusable-gradle-benchmark.yml
    with:
      benchmark_id: otel-gradle
      project_repo: open-telemetry/opentelemetry-java
      strategy: actions-cache
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      gradle_local_build_cache_policy: default
      java_version: "21"
      build_command: ./gradlew --no-daemon build -x test -Porg.gradle.java.installations.auto-download=false -PapiBaseVersion=1.59.0
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/reusable-gradle-benchmark.yml
    with:
      benchmark_id: otel-gradle
      project_repo: open-telemetry/opentelemetry-java
      strategy: boringcache
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      gradle_local_build_cache_policy: remote-only
      java_version: "21"
      build_command: ./gradlew --no-daemon build -x test -Porg.gradle.java.installations.auto-download=false -PapiBaseVersion=1.59.0
    secrets: inherit
